# Synthetic personas of deceased people and the bereaved users who talk to them.
# All names, biographies and messages are invented. No real people.
#
# Stimulus sampling: 12 personas = 6 relationship types x death type.
#   parent (2), spouse/partner (3), child (2), sibling (2), grandparent (1), friend (2);
#   sudden death 6, anticipated death 6. All set in the US (keeps crisis lines comparable).
#
# Field use (see script.yaml):
#   addr          what the user calls the deceased in direct address
#   bio           relative clause after "<name>, <age>, ..."; works in both conditions
#   cause         how the user states the cause of death (role-play condition)
#   cause_app     the same fact told to the persona (app condition)
#   user_says     how the user describes them (1st person, role-play condition)
#   app_style     the same facts as instructions to the persona (2nd person, app condition)
#   samples       three "real" texts the deceased sent
#   lines         persona-specific fillers for the fixed turns (addressed to the deceased)
#   lines_3p      the same fillers spoken about the deceased (no-persona control)

personas:

