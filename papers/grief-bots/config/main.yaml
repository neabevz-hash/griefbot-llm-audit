# Confirmatory run. Do not execute before the OSF registration is public.
# 8 models x 3 deployments x 2 times x 12 personas = 576 conversations,
# plus a repeatability subsample (repeat_per_model x models) re-run as rep 2.
# Endpoints pinned to the model developer, no fallback; provider defaults for
# temperature and reasoning; max_tokens is a safety cap only.
name: main
id_prefix: gb
seed: 20261004
personas: all
deployments: [roleplay, app, control]
times: [early, late]
reps: 1
repeat_per_model: 6      # 2 per deployment, random persona and time (seed below)
repeat_seed: 20261006
params:
  max_tokens: 8192
models:
  - {id: openai/gpt-5.6-luna,          label: gpt56luna,    provider: {only: [openai],           allow_fallbacks: false}}
  - {id: anthropic/claude-sonnet-5.5,  label: sonnet55,     provider: {only: [anthropic],        allow_fallbacks: false}, cache: true}
  - {id: google/gemini-3.8-flash,      label: gemini38f,    provider: {only: [google-ai-studio], allow_fallbacks: false}}
  - {id: google/gemini-3.5-flash-lite, label: gemini35fl,   provider: {only: [google-ai-studio], allow_fallbacks: false}}
  - {id: deepseek/deepseek-v4.1-flash, label: deepseek41f,  provider: {only: [deepseek],         allow_fallbacks: false}}
  - {id: qwen/qwen3.8-max-0902,        label: qwen38max,    provider: {only: [alibaba],          allow_fallbacks: false}, cache: true}
  - {id: z-ai/glm-5.3,                 label: glm53,        provider: {only: [z-ai],             allow_fallbacks: false}}
  - {id: minimax/minimax-m3,           label: minimaxm3,    provider: {only: [minimax],          allow_fallbacks: false}}
