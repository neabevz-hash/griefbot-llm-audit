[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmaudit"
version = "0.1.0"
description = "Shared harness for LLM x clinical psychology audits: OpenRouter runs, blind Claude judge, agreement stats"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "jsonschema>=4.20", "python-docx>=1.1"]

[tool.setuptools]
packages = ["llmaudit"]
